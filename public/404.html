<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — Basant Koiri | Full-Stack &amp; DSA Engineer</title>
    <script>
      (function () {
        var hash = window.location.pathname.replace(/^\/+/, '');
        var target = '/' + (hash ? '#' + encodeURIComponent(hash) : '');
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">basantkoiri.com.np</a>…</p>
  </body>
</html>
